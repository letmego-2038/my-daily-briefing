<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <title>데일리 브리핑</title>
  <style>
    :root { --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#e2e8f0; --accent:#2563eb; --badge:#eff6ff; }
    .dark { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; --accent:#60a5fa; --badge:#1e3a5f; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom:76px; }
    header { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
    .title { font-size:17px; font-weight:700; }
    .controls { display:flex; gap:8px; align-items:center; }
    select, button { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; }
    main { padding:14px 16px; max-width:640px; margin:0 auto; }
    .slot-bar { display:flex; gap:8px; margin-bottom:12px; }
    .slot-btn { flex:1; text-align:center; font-weight:600; }
    .slot-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
    .tag { display:inline-block; background:var(--badge); color:var(--accent); font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; margin-bottom:6px; }
    h3 { font-size:15px; line-height:1.4; margin-bottom:6px; }
    p { font-size:13.5px; line-height:1.55; color:var(--sub); margin-bottom:8px; }
    .pick { background:var(--bg); border-radius:8px; padding:8px 10px; margin-top:6px; font-size:13px; }
    .pick strong { color:var(--accent); }
    .empty { text-align:center; padding:48px 16px; color:var(--sub); font-size:14px; }
    nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; height:62px; }
    nav button { flex:1; border:none; background:none; border-radius:0; font-size:12px; color:var(--sub); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    nav button.active { color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
  <header>
    <div class="title">데일리 브리핑</div>
    <div class="controls">
      <select id="dateSelect"></select>
      <button id="themeBtn">🌙</button>
    </div>
  </header>
  <main id="app"><div class="empty">브리핑 데이터를 불러오는 중...</div></main>
  <nav>
    <button class="active" data-tab="domestic">📈<span>국내시황</span></button>
    <button data-tab="news">🌏<span>한·미·일</span></button>
    <button data-tab="us">⚡<span>미국산업</span></button>
    <button data-tab="social">🔍<span>사회·테마</span></button>
  </nav>
  <script>
    let currentTab = 'domestic', currentSlot = '08', data = null;
    const app = document.getElementById('app');
    const dateSelect = document.getElementById('dateSelect');
    const themeBtn = document.getElementById('themeBtn');

    if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }
    themeBtn.onclick = () => {
      const dark = document.body.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      themeBtn.textContent = dark ? '☀️' : '🌙';
    };

    document.querySelectorAll('nav button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      };
    });

    async function loadDates() {
      try {
        const res = await fetch('./data/index.json?t=' + Date.now());
        if (!res.ok) throw new Error();
        const dates = await res.json();
        dateSelect.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('');
        if (dates.length) loadDate(dates[0]);
        else app.innerHTML = '<div class="empty">아직 생성된 브리핑이 없습니다.<br>GitHub Actions를 먼저 실행해 주세요.</div>';
      } catch {
        app.innerHTML = '<div class="empty">아직 브리핑 데이터가 없습니다.<br>3단계에서 자동 실행을 완료하면 여기에 표시됩니다.</div>';
      }
    }

    async function loadDate(date) {
      const res = await fetch(`./data/${date}.json?t=` + Date.now());
      data = await res.json();
      const slots = Object.keys(data.domestic || {}).sort();
      if (slots.length) currentSlot = slots[slots.length - 1];
      render();
    }

    dateSelect.onchange = () => loadDate(dateSelect.value);

    function render() {
      if (!data) return;
      if (currentTab === 'domestic') {
        const slotData = data.domestic?.[currentSlot];
        const bar = `<div class="slot-bar">
          ${['08','14','16'].map(s => `<button class="slot-btn ${currentSlot===s?'active':''}" onclick="currentSlot='${s}';render()">${s==='08'?'08:00 장전':s==='14'?'14:00 장중':'16:00 장마감'}</button>`).join('')}
        </div>`;
        if (!slotData) { app.innerHTML = bar + '<div class="empty">해당 시간대 브리핑이 아직 업데이트되지 않았습니다.</div>'; return; }
        app.innerHTML = bar +
          `<div class="card"><span class="tag">${slotData.updatedAt || ''}</span><h3>오늘의 증시 요약</h3><p>${slotData.marketSummary || ''}</p></div>` +
          (slotData.issues || []).map(i => `<div class="card"><span class="tag">${i.tag}</span><h3>${i.title}</h3><p>${i.summary}</p>
            ${(i.picks || []).map(p => `<div class="pick"><strong>${p.name}</strong> · ${p.reason}</div>`).join('')}
          </div>`).join('');
      } else if (currentTab === 'news') {
        app.innerHTML = (data.news || []).map(n => `<div class="card"><span class="tag">${n.country} · ${n.source}</span><h3>${n.title}</h3><p>${n.summary}</p><div class="pick"><strong>시사점</strong> · ${n.impact}</div></div>`).join('') || '<div class="empty">뉴스 데이터가 없습니다.</div>';
      } else if (currentTab === 'us') {
        app.innerHTML = (data.us_industry || []).map(u => `<div class="card"><span class="tag">${u.sector}</span><h3>${u.title}</h3><p>${u.summary}</p><div class="pick"><strong>미국 관련주</strong> · ${(u.usTickers||[]).join(', ')}</div><div class="pick"><strong>국내 연관</strong> · ${u.krLink}</div></div>`).join('') || '<div class="empty">미국 산업 데이터가 없습니다.</div>';
      } else {
        app.innerHTML = (data.social_theme || []).map(s => `<div class="card"><span class="tag">${s.category}</span><h3>${s.issue}</h3><p><strong>산업·정책 파급:</strong> ${s.industryImpact}</p>${(s.picks || []).map(p => `<div class="pick"><strong>${p.name}</strong> · ${p.reason}</div>`).join('')}</div>`).join('') || '<div class="empty">사회·테마 데이터가 없습니다.</div>';
      }
    }
    loadDates();
  </script>
</body>
</html>
